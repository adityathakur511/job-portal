{% extends 'base.html' %}

{% load static %}

{% block main %}

<div style="background-color: rgb(4, 4, 47); color: white;" class="row py-5  text-center text-white ">
    <div class="col-sm-12"  >
        <h1>Welcome Back</h1>
        <p>Sign in to continue on this app.</p>
    </div>
</div>

<div class="row bg-secondary" style="box-shadow: 3px black;">
    <div class="col-sm-7 mt-2 mb-2 mx-auto ">
        <div class="card p-4 bg-#121b29">
            <h2 style="text-align: center;">Login</h2>
            <p style="text-align: center;">Enter your credentials to access your account.</p>
            {% if messages %}
            {% for m in messages %}
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{m}}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            <form method="Post">
                {% csrf_token %}
                <label for="Uname" class="form-label">Username</label>
                <input type="text" name="Username" id="Uname" class="form-control mb-5">

                <label for="Password" class="form-label">Password</label>
                <input type="Password" name="Password" id="Password" class="form-control mb-4">

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <p class="mt-4 text-center">Not register yet? </p>
             <a class="nav-link" href="{% url 'register' %}"><button type="button" class="btn btn-outline-black" style="text-align: center;">Register now</button>
           </a>
           
        </div>
    </div>
</div>



{% endblock %}
